<!doctype html>
<html lang="en">
<head>
  <!-- ========================= -->
  <!-- META / HEAD -->
  <!-- ========================= -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Client Command Center</title>

  <!-- ========================= -->
  <!-- STYLES -->
  <!-- ========================= -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- ========================= -->
  <!-- HEADER -->
  <!-- ========================= -->
  <header>
    <div class="headerBrand">
      <h1>Client Command Center</h1>
      <p class="sub">Track client touchpoints and reach out on schedule.</p>
    </div>
    <nav class="tierNav" aria-label="Tier navigation">
      <a class="tierNavLink tier-3" href="tier?tier=3">Tier 3</a>
      <a class="tierNavLink tier-2" href="tier?tier=2">Tier 2</a>
      <a class="tierNavLink tier-1" href="tier?tier=1">Tier 1</a>
      <a class="tierNavLink tier-0" href="tier?tier=0">Tier 0 / Prospect</a>
      <a class="tierNavLink" href="client-list">Client List</a>
      <a class="tierNavLink tierNavLink--right" href="/logout">Logout</a>
    </nav>
  </header>

  <!-- ========================= -->
  <!-- MAIN -->
  <!-- ========================= -->
  <main>

    <!-- ========================= -->
    <!-- TODAY (PRIORITY LIST) -->
    <!-- ========================= -->
    <section class="card" id="todaySection">
      <div class="row row-tight">
        <h2>Today</h2>
        <div class="hint">Needs attention or due within 10 days • color = tier</div>
      </div>
      <div id="todaySummary" class="todaySummary" aria-live="polite"></div>
      <ul id="todayList" class="todayList"></ul>
    </section>

    <section class="card" id="touchedThisWeekSection" style="display: none;">
      <div class="row row-tight">
        <h2>Touched this week</h2>
        <div class="hint">Already reached out — avoid double-touching</div>
      </div>
      <ul id="touchedThisWeekList" class="todayList"></ul>
    </section>

  </main>

  <!-- ========================= -->
  <!-- EDIT DIALOG -->
  <!-- ========================= -->
  <dialog id="editDialog">
    <form method="dialog" class="card dialogCard" id="editForm">
      <h2>Edit Client</h2>

      <input type="hidden" id="editId" />

      <label>
        Client Name
        <input id="editName" required />
      </label>

      <label>
        Tier
        <select id="editTier">
          <option value="3">Tier 3</option>
          <option value="2">Tier 2</option>
          <option value="1">Tier 1</option>
          <option value="0">Tier 0 / Prospect</option>
        </select>
      </label>

      <label>
        Primary Contact
        <input id="editContact" />
      </label>

      <label>
        Phone
        <input id="editPhone" type="tel" placeholder="555-123-4567" />
      </label>

      <label>
        Notes
        <textarea id="editNotes" rows="2"></textarea>
      </label>

      <label>
        Next touch
        <input type="date" id="editNextTouch" />
        <span class="fieldHint">Set when you plan to follow up.</span>
      </label>

      <label>
        To Do
        <textarea id="editNextAction" rows="2" placeholder="What’s the next step?"></textarea>
      </label>

      <label>
        Last touch
        <input type="date" id="editLastTouch" />
      </label>

      <div class="row row-right">
        <button value="cancel" class="ghost" type="button" id="editCancel">Cancel</button>
        <button value="default" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <!-- ========================= -->
  <!-- SMALL PAGE-LEVEL HELPERS -->
  <!-- ========================= -->
  <script>
    document.addEventListener("click", (e) => {
      if (e.target && e.target.id === "editCancel") {
        document.getElementById("editDialog")?.close();
      }
    });
  </script>

  <!-- ========================= -->
  <!-- APP SCRIPT -->
  <!-- ========================= -->
  <script src="app.js"></script>
</body>
</html>
