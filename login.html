<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login • Client Command Center</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #020617, #0f172a);
      color: #e5e7eb;
    }
    .card {
      width: 100%;
      max-width: 360px;
      padding: 28px;
      background: #111827;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .sub { color: #9ca3af; font-size: 14px; margin-bottom: 24px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.03);
      color: #e5e7eb;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(96,165,250,0.6);
      background: rgba(96,165,250,0.15);
      color: #60a5fa;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: rgba(96,165,250,0.25); }
    .error { color: #f87171; font-size: 14px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Client Command Center</h1>
    <p class="sub">Sign in to continue</p>
    <p class="error" id="err" style="display:none;">Invalid username or password.</p>
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    if (window.location.search.includes('error=1')) document.getElementById('err').style.display = 'block';
  </script>
</body>
</html>
